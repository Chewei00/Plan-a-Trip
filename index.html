<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SomeDay</title>
<link rel="icon" href="./favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css?v=17">
</head>
<body>
<div class="app" id="app">
  <div class="map" id="map" aria-label="地圖">
    <div class="mapgl" id="mapgl"></div>
    <p class="routeby">Routes: Powered by <a href="https://www.geoapify.com/" target="_blank" rel="noopener">Geoapify</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>
    <div class="ctrl"><button data-act="fit" title="顯示全部地點">Fit</button><button data-act="zoom-out" aria-label="縮小" title="縮小">−</button><button data-act="zoom-in" aria-label="放大" title="放大">＋</button></div>
  </div>
  <aside class="lp" id="lp" aria-label="行程">
    <div class="lp-head">
      <div class="lp-top"><div id="titlewrap"></div><button class="sidebtn" id="lh" data-act="toggle-left"></button></div>
      <div class="search"><input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="搜尋地點"><div class="results" id="results" hidden></div></div>
    </div>
    <div class="lp-scroll" id="lpscroll"></div>
    <div class="memo" id="memo">
      <button class="memo-handle" id="memoh" data-act="memo-toggle"></button>
      <div class="memo-body"><div class="memo-clip"><div class="memo-in">
        <div class="memo-ents" id="memoents" data-stop="memo"></div>
        <div class="memo-adds" id="memoadds"></div>
      </div></div></div>
    </div>
  </aside>
  <section class="tp" id="tp" aria-label="Travel Collection">
    <button class="tclose" id="th" data-act="toggle-top"></button>
    <div class="tp-head"><h2>Travel Collection</h2><div class="chips" id="chips"></div></div>
    <div class="cards" id="cards"></div>
    <button class="tabdown" id="ttab" data-act="toggle-top"></button>
  </section>
</div>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="viewer" id="viewer" hidden><div class="vbox" role="dialog" aria-modal="true" aria-label="檔案預覽"><div class="vhead"><span class="vname" id="vname"></span><button class="xbtn" data-act="viewer-close" aria-label="關閉"></button></div><div class="vbody" id="vbody"></div></div></div>
<input type="file" id="filein" accept="application/pdf,image/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<p class="narrow">目前只設計了電腦的版面，請用電腦開啟。</p>

<script type="module" src="./js/main.js?v=17"></script>
</body>
</html>
