<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fefefe">
<title>SomeDay</title>
<link rel="icon" href="../favicon-32.png?v=2" sizes="32x32" type="image/png">
<link rel="icon" href="../favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* SomeDay on a phone: one trip, to read and to tick, as it was when the desktop made the link. Everything is in this
   one file (styles, script, icons) so that the copy a phone keeps for offline use is always whole. The trip itself is
   in the address, after the #; nothing is fetched for it and nothing is sent anywhere. See "The phone page" in
   CLAUDE.md. Values are the 旅行地圖 design system's; the sizes are the phone's own (type two steps up, things to
   press at least 36 high). */
:root{
  color-scheme:light;
  --page:#f1efe9; --surface:#fefefe; --ink:#333; --on-ink:#fefefe;
  --text-2:rgba(0,0,0,.5); --text-3:rgba(0,0,0,.4);
  --line:#d2d2d2; --line-soft:#e5e5e5; --line-strong:rgba(0,0,0,.4); --fill-note:rgba(0,0,0,.04);
  --cat-sight:#86d7bb; --cat-food:#e3be80; --cat-stay:#9dc7fe; --cat-transit:#deb2e9;
  --r6:6px;
  --ui:"Noto Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:var(--ink);font:400 14px/22px var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block;flex:none;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* the page scrolls as a whole (so the browser's own bars can tuck away); --sh is the height of the window, which the
   notes at the foot measure themselves against. On something wider than a phone it is a column in the middle. */
.screen{--sh:100vh;display:flex;flex-direction:column;max-width:480px;min-height:100vh;margin:0 auto;background:var(--surface)}
@supports (height:100dvh){.screen{--sh:100dvh;min-height:100dvh}}

.top{position:sticky;top:0;z-index:3;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 12px;background:var(--surface)}
.top h3{margin:0;font:400 20px/26px var(--ui);letter-spacing:.04em;overflow-wrap:anywhere}
.top p{margin:2px 0 0;font:400 12px/18px var(--ui);letter-spacing:.04em;color:var(--text-3)}
.body{flex:1 0 auto;padding:4px 20px 40px}
.day{padding:10px 0 6px}
.dayhead{display:flex;align-items:center;width:100%;min-height:36px;padding:0;border:0;background:none;text-align:left}
.daypill{display:inline-flex;align-items:center;gap:12px;height:28px;padding:0 10px 0 11px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--on-ink);font:500 13px/18px var(--ui);transition:background-color .25s ease,border-color .25s ease,color .25s ease}
.daypill svg{width:9px;height:9px;stroke-width:1.5;transform:rotate(90deg);transition:transform .25s ease}
.day.shut .daypill{background:var(--surface);border-color:var(--line);color:var(--ink)}
.day.shut .daypill svg{transform:none}
.daysum{margin-left:10px;font:400 12px/18px var(--ui);letter-spacing:.04em;color:var(--text-3)}
.stops{margin:0;padding:2px 0 0;list-style:none}

.stop{position:relative;padding:0 0 4px 26px}
.stop::before{content:"";position:absolute;left:7px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--ink);transition:top .25s ease,background-color .25s ease}
.stop:not(:last-child)::after{content:"";position:absolute;left:9.5px;top:27px;bottom:-9px;border-left:1px dotted var(--line-strong);transition:top .25s ease,bottom .25s ease,border-color .25s ease}
/* The row is as high as the name makes it (22 of text and a margin above and below it), and everything in the row
   starts at the top, so the dot, which sits at a fixed height, is level with the name's first line: open or closed,
   one line or several. */
.srow{display:flex;align-items:flex-start;gap:8px}
/* A closed day keeps its places' names, as on the desktop: the rows draw together, the category and the arrow fade,
   and what is under each name (notes, checklist, the way to the next place) folds away. Classes are switched on the
   elements that are already there, never redrawn, so that all of it can move. */
.day.shut .sname{padding-block:4px}
.day.shut .cat{margin-top:6px}
.day.shut .stop::before{top:12px}
.day.shut .stop:not(:last-child)::after{top:24px;bottom:-6px}
.day.dim .stop::before{background:var(--line)}
.day.dim .stop:not(:last-child)::after{border-left-color:var(--line)}
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.day.shut .fold{grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .25s ease,visibility 0s .25s}
/* reaches left as far as the dotted line, so that the icon standing on the line is not cut off */
.foldin{min-height:0;overflow:hidden;margin-left:-26px;padding-left:26px}
.sname{flex:1;min-width:0;padding-block:7px;font:500 15px/22px var(--ui);letter-spacing:.04em;overflow-wrap:anywhere;transition:padding .25s ease}
.cat{flex:none;width:18px;height:18px;margin-top:9px;border-radius:50%;color:#000;transition:opacity .15s ease,margin-top .25s ease}
.day.shut .cat,.day.shut .go{opacity:0}
.cat svg{width:18px;height:18px;stroke-width:1.1;opacity:.6}
.cat-sight{background:var(--cat-sight)}.cat-food{background:var(--cat-food)}.cat-stay{background:var(--cat-stay)}.cat-transit{background:var(--cat-transit)}
.go{flex:none;display:grid;place-items:center;width:36px;height:36px;margin-right:-8px;border-radius:50%;color:var(--text-2);transition:opacity .15s ease,height .25s ease}
.day.shut .go{height:30px;visibility:hidden;transition:opacity .15s ease,height .25s ease,visibility 0s .15s}
.go svg{width:16px;height:16px;stroke-width:1.4}
.go:active{background:var(--fill-note)}
.ents{display:flex;flex-direction:column;gap:8px;padding:2px 0 10px}
.ents:empty{display:none}
.nb{position:relative;isolation:isolate;padding:8px 12px;border-radius:var(--r6);background:var(--fill-note);font:400 14px/22px var(--ui);letter-spacing:.04em;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
/* Smooth corners. The desktop asks the browser for them (corner-shape), which no iPhone browser can do yet, so here
   the same curve is drawn: a shape behind the note, redrawn when the note changes size. Until it is drawn, and where
   it cannot be, the note keeps ordinary round corners. */
.nb.smooth{border-radius:0;background:none}
.nb>svg{position:absolute;left:0;top:0;z-index:-1;width:100%;height:100%;overflow:visible;fill:var(--fill-note);stroke:none}
.ck{display:flex;align-items:flex-start;gap:4px;margin-left:-8px}
/* a box has 8 of its own touch area above and below it. Two checklist lines in a row therefore sit directly together
   (the list's gap of 8 taken back), so that box to box is 16, the same as box to note. */
.ck+.ck{margin-top:-8px}
.cbtn{flex:none;display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;background:none}
/* the box is one drawing, 20 x 20: its line (inside the edge), its filled state and the tick, so the tick is in the
   middle on any screen and the corners are the smooth ones */
.cbox{display:block;width:20px;height:20px}
.cbox svg{width:20px;height:20px}
.cbox .bx{stroke:var(--line);stroke-width:1.5}
.cbox .fl{fill:var(--ink);stroke:none;visibility:hidden}
.cbox .tk{stroke:var(--on-ink);stroke-width:1;visibility:hidden}
.ck.done .cbox .bx{visibility:hidden}
.ck.done .cbox .fl,.ck.done .cbox .tk{visibility:visible}
.cmain{flex:1;min-width:0;padding:7px 0}
.ctext{font:400 14px/22px var(--ui);letter-spacing:.04em;color:var(--text-2);overflow-wrap:anywhere}
.ck.done .ctext{color:var(--text-3)}
.extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.extra:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 9px;border:1px solid var(--line);border-radius:999px;font:500 12px/18px var(--ui);letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.tag svg{width:12px;height:12px;stroke-width:1.1}
.tag.off{border-style:dashed;color:var(--text-3)}
.leg{position:relative;display:flex;align-items:center;min-height:22px;margin:0 0 10px;font:500 12px/18px var(--ui);letter-spacing:.04em;color:var(--text-2)}
.leg svg{position:absolute;left:-24px;top:50%;z-index:1;width:16px;height:16px;margin-top:-8px;stroke-width:1.2;background:var(--surface);box-shadow:0 -3px 0 var(--surface),0 3px 0 var(--surface)}
/* The trip's notes, as on the desktop: a sheet held at the foot of the screen. Closed, only its handle shows (a line
   and an arrow); opened, the whole sheet is drawn up from under the foot, line first, .45s, and let down the same
   way, cut off by the foot and not squeezed. It rises at most to where Day 1's label is; beyond that its entries
   scroll. It stays in the page's flow, so the end of the itinerary can always be scrolled clear of it. */
.memo{position:sticky;bottom:0;z-index:3;flex:none;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface)}
.memo-handle{position:relative;display:block;width:100%;height:36px;padding:0;border:0;background:none;color:var(--ink)}
.memo-handle::before{content:"";position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--ink)}
.memo-handle svg{position:absolute;left:50%;top:11px;width:12px;height:7.2px;margin-left:-6px;stroke-width:1.2;transition:transform .45s ease}
.memo.open .memo-handle svg{transform:rotate(180deg)}
.memo-handle:focus-visible{outline-offset:-2px}
.memo-body{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .45s ease,visibility 0s .45s}
.memo.open .memo-body{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .45s ease,visibility 0s}
.memo-clip{min-height:0;overflow:hidden}
.memo-in{padding:2px 20px 16px}
/* reaches left by the checkbox's margin, so that scrolling does not cut the boxes off */
.memo-ents{display:flex;flex-direction:column;gap:8px;max-height:calc(var(--sh) - 156px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));margin-left:-8px;padding-left:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.memo-ents::-webkit-scrollbar{display:none}

/* nothing to show: no trip has been opened here yet, or the link could not be read */
.blank{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:40px 32px calc(40px + env(safe-area-inset-bottom,0px))}
.blank h1{margin:0;font:400 20px/26px var(--ui);letter-spacing:.04em}
.blank p{margin:0;font:400 14px/22px var(--ui);letter-spacing:.04em;color:var(--text-2)}
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script>
(function(){
  'use strict';
  /* ---------- icons: the site's own drawings (js/icons.js), copied so that this file stands alone ---------- */
  var CATS=['sight','food','stay','transit'],CATNAME={sight:'景點',food:'飲食',stay:'住宿',transit:'交通'};
  var CAT={
    sight:'<circle cx="6.77" cy="7.16" r=".84" fill="currentColor" stroke="none"/><circle cx="11.23" cy="7.16" r=".84" fill="currentColor" stroke="none"/><path d="M6.84 10.55c1.28 1.5 3.46 1.11 4.33 0"/>',
    food:'<path d="M5.2 4.6v2.2a1.4 1.4 0 0 0 2.8 0V4.6M6.6 4.6v8.8M11.6 8.6v4.8M10.1 6.6a1.5 2 0 1 0 3 0a1.5 2 0 1 0-3 0z"/>',
    stay:'<path d="M4.5 5.6v7M4.5 11h9v1.6M7.4 11V8.6h4.1a2 2 0 0 1 2 2V11"/>',
    transit:'<path d="M7.4 4.4h3.2a1.8 1.8 0 0 1 1.8 1.8v3.8a1.8 1.8 0 0 1-1.8 1.8H7.4a1.8 1.8 0 0 1-1.8-1.8V6.2a1.8 1.8 0 0 1 1.8-1.8zM5.6 8.4h6.8M7 11.8l-1 1.8M11 11.8l1 1.8"/><circle cx="7.6" cy="10.1" r=".6" fill="currentColor" stroke="none"/><circle cx="10.4" cy="10.1" r=".6" fill="currentColor" stroke="none"/>'
  };
  /* the six ways to move, in the order the desktop lists them (the link names them by their number) */
  var MODES=[
    ['步行','<circle cx="8.6" cy="2.9" r="1.35" fill="currentColor" stroke="none"/><path d="M8.4 5.8 7.6 9.6 5.4 13.8M7.6 9.6l3 4M5.6 8l2.8-2.2L11 7.6"/>'],
    ['自行車','<path d="M1 10.5a2.7 2.7 0 1 0 5.4 0a2.7 2.7 0 1 0-5.4 0zM9.6 10.5a2.7 2.7 0 1 0 5.4 0a2.7 2.7 0 1 0-5.4 0zM3.7 10.5 6.6 5.8h3.2l2.5 4.7M9.8 5.8 9.3 4h1.6"/>'],
    ['汽車','<path d="M2.3 10.6V8.7l1.4-3.4a1 1 0 0 1 .9-.6h6.8a1 1 0 0 1 .9.6l1.4 3.4v1.9M6.4 10.6h3.2M3.4 10.9a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0zM9.6 10.9a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0z"/>'],
    ['電車或公車','<path d="M5.8 2h4.4a2 2 0 0 1 2 2v5.4a2 2 0 0 1-2 2H5.8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM3.8 7h8.4M5.8 14l.9-2.6M10.2 14l-.9-2.6"/>'],
    ['船','<path d="M2 10.6h12l-1.8 3H3.8zM7.6 10.6V2.4l4.6 6H7.6"/>'],
    ['飛機','<path d="M8 2.2v11.4M8 6.2 2.6 9.8M8 6.2l5.4 3.6M6 13.6h4"/>']
  ];
  var I={
    chev:'<svg viewBox="0 0 8 8" aria-hidden="true"><path d="M2.5 1 5.5 4 2.5 7"/></svg>',
    go:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>',
    up:'<svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1.5 4.6 5 1.4l3.5 3.2"/></svg>',
    link:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 6.5a2.5 2.5 0 0 0 3.77.27l1.5-1.5a2.5 2.5 0 0 0-3.54-3.54l-.86.86"/><path d="M7 5.5a2.5 2.5 0 0 0-3.77-.27l-1.5 1.5a2.5 2.5 0 0 0 3.54 3.54l.85-.86"/></svg>',
    file:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7 1H3.2a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h5.6a1 1 0 0 0 1-1V3.8zM7 1v2.8h2.8"/></svg>'
  };
  var sc=document.getElementById('screen');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  /* ---------- the trip in the address ----------
     After the # comes "1." and the trip, squeezed (deflate) and written in letters that survive being sent around
     (base64url); "0." is the same without the squeezing, from a browser that could not do it. What the desktop puts
     in is in packTrip() in js/main.js; the two must agree. Everything read here comes from outside: every word is
     escaped before it is shown, links must be http(s), and anything not of the expected shape is dropped. */
  function bytesOf(b64){
    var bin=atob(b64.replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(bin.length),i;
    for(i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return a;
  }
  function unpack(code){
    var m=/^([01])\.([A-Za-z0-9_-]+)$/.exec(code);
    if(!m)return Promise.reject(new Error('shape'));
    var bytes;
    try{bytes=bytesOf(m[2]);}catch(e){return Promise.reject(new Error('shape'));}
    if(m[1]==='0')return Promise.resolve(new TextDecoder().decode(bytes)).then(JSON.parse).then(trip);
    if(!window.DecompressionStream)return Promise.reject(new Error('old'));
    return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(JSON.parse).then(trip);
  }
  function str(v,max){return typeof v==='string'?v.slice(0,max):'';}
  /* the link's short form -> what this page draws. A ticked item is known by the place it is under and its words
     (and which one, if the same words come twice), so a tick made here survives a newer link of the same trip. */
  function trip(o){
    if(!o||o.v!==1||!Array.isArray(o.d))throw new Error('shape');
    var seen={};
    function entries(list,scope){
      return (Array.isArray(list)?list:[]).map(function(e){
        if(typeof e==='string')return {k:'n',text:e.slice(0,400)};
        if(!Array.isArray(e))return null;
        var text=str(e[0],300),link=str(e[2],600),base=scope+'\n'+text,n=seen[base]=(seen[base]||0)+1;
        return {k:'c',text:text,done:!!e[1],link:/^https?:\/\//i.test(link)?link:'',file:str(e[3],200),key:base+'\n'+n};
      }).filter(Boolean);
    }
    return {
      id:str(o.id,40)||'trip',title:str(o.t,60)||'Trip',at:typeof o.at==='number'?o.at:0,
      days:o.d.map(function(stops){return (Array.isArray(stops)?stops:[]).map(function(s){
        if(!s||typeof s!=='object')return null;
        var name=str(s.n,80),href='',q='https://www.google.com/maps/search/?api=1&query=';
        if(typeof s.g==='string'&&/^[A-Za-z0-9_-]{6,300}$/.test(s.g))href=q+encodeURIComponent(name)+'&query_place_id='+s.g;
        else if(Array.isArray(s.p)&&isFinite(s.p[0])&&isFinite(s.p[1])&&typeof s.p[0]==='number'&&typeof s.p[1]==='number')href=q+s.p[0]+'%2C'+s.p[1];
        return {name:name,cat:CATS[s.c]||'',href:href,plan:entries(s.e,name),
          leg:Array.isArray(s.l)&&MODES[s.l[0]]?[s.l[0],typeof s.l[1]==='number'&&s.l[1]>0?Math.round(s.l[1]):0]:null};
      }).filter(Boolean);}),
      memo:entries(o.m,'')
    };
  }

  /* ---------- what this phone remembers ----------
     Per trip: the link's own text (so the trip can be shown again from the bare address), the ticks made here, which
     days are closed and whether the notes are open. Kept in this browser only. */
  var KEY='someday-phone:v1',store={last:'',trips:{}},T=null,TRIP=null;
  try{var raw=localStorage.getItem(KEY),o=raw&&JSON.parse(raw);if(o&&o.trips&&typeof o.trips==='object')store={last:String(o.last||''),trips:o.trips};}catch(e){}
  function keep(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
  function isDone(en){return en.key in T.done?!!T.done[en.key]:en.done;}

  /* A rectangle with the product's smooth corners: the curve |x|^n + |y|^n = 1 with n = 2^1.4, which is what the
     desktop's corner-shape:superellipse(1.4) draws. `inset` moves the edge inwards (for a line drawn inside the edge). */
  var POW=2/Math.pow(2,1.4),STEPS=14;
  function smooth(w,h,r,inset){
    var o=inset||0,x0=o,y0=o,x1=w-o,y1=h-o,c=[],d=[],i,t;
    r=Math.max(0,Math.min(r-o,(x1-x0)/2,(y1-y0)/2));
    for(i=0;i<=STEPS;i++){t=i/STEPS*Math.PI/2;c.push([r*(1-Math.pow(Math.cos(t),POW)),r*(1-Math.pow(Math.sin(t),POW))]);}
    function pt(x,y){d.push((d.length?'L':'M')+(+x.toFixed(2))+' '+(+y.toFixed(2)));}
    for(i=0;i<=STEPS;i++)pt(x0+c[i][0],y0+c[i][1]);
    for(i=STEPS;i>=0;i--)pt(x1-c[i][0],y0+c[i][1]);
    for(i=0;i<=STEPS;i++)pt(x1-c[i][0],y1-c[i][1]);
    for(i=STEPS;i>=0;i--)pt(x0+c[i][0],y1-c[i][1]);
    return d.join('')+'Z';
  }
  /* radii: the desktop's, times the same 1.25 it uses for smooth corners (note 6 -> 7.5, this box 5 -> 6.25) */
  var NOTE_R=7.5;
  var BOX='<svg viewBox="0 0 20 20" aria-hidden="true"><path class="bx" d="'+smooth(20,20,6.25,.75)+'"/><path class="fl" d="'+smooth(20,20,6.25)+'"/>'+
    '<path class="tk" transform="scale(1.5385) translate(0 -.26)" d="M3.63 5.95l2.05 2.87c.08.11.24.11.32.01l3.36-4.2"/></svg>';
  function shape(el){
    var b=el.getBoundingClientRect(),p=el.firstElementChild;
    if(!p||p.tagName.toLowerCase()!=='svg'||!b.width)return;
    p.firstChild.setAttribute('d',smooth(b.width,b.height,NOTE_R));
    el.classList.add('smooth');
  }
  var watch=window.ResizeObserver?new ResizeObserver(function(list){list.forEach(function(e){shape(e.target);});}):null;

  function entry(en){
    if(en.k==='n')return '<div class="nb"><svg aria-hidden="true"><path/></svg>'+esc(en.text)+'</div>';
    var done=isDone(en),x='';
    if(en.link)x+='<a class="tag" href="'+esc(en.link)+'" target="_blank" rel="noopener noreferrer">'+I.link+'<span>Link</span></a>';
    if(en.file)x+='<span class="tag off" title="附件沒有帶到手機">'+I.file+'<span>'+esc(en.file)+'・在電腦上</span></span>';
    return '<div class="ck'+(done?' done':'')+'"><button type="button" class="cbtn" data-ck="'+esc(en.key)+'" role="checkbox" aria-checked="'+done+'" aria-label="'+esc(en.text)+'"><span class="cbox">'+BOX+'</span></button>'+
      '<div class="cmain"><div class="ctext">'+esc(en.text)+'</div><div class="extra">'+x+'</div></div></div>';
  }
  function fmtMin(m){if(m<60)return m+'\u00a0m';var h=Math.floor(m/60),r=m%60;return h+'\u00a0h'+(r?' '+r+'\u00a0m':'');}
  function stop(s){
    var h='<li class="stop"><div class="srow"><span class="sname">'+esc(s.name)+'</span>'+
      (s.cat?'<span class="cat cat-'+s.cat+'" role="img" aria-label="'+CATNAME[s.cat]+'" title="'+CATNAME[s.cat]+'"><svg viewBox="0 0 18 18" aria-hidden="true">'+CAT[s.cat]+'</svg></span>':'')+
      (s.href?'<a class="go" href="'+esc(s.href)+'" target="_blank" rel="noopener noreferrer" aria-label="在 Google 地圖開啟 '+esc(s.name)+'">'+I.go+'</a>':'')+'</div>'+
      '<div class="fold"><div class="foldin"><div class="ents">'+s.plan.map(entry).join('')+'</div>';
    if(s.leg)h+='<div class="leg" title="到下一站：'+MODES[s.leg[0]][0]+'"><svg viewBox="0 0 16 16" aria-hidden="true">'+MODES[s.leg[0]][1]+'</svg><span>'+(s.leg[1]?fmtMin(s.leg[1]):'')+'</span></div>';
    return h+'</div></div></li>';
  }
  function two(n){return (n<10?'0':'')+n;}
  function when(ms){var d=new Date(ms);return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())+' '+two(d.getHours())+':'+two(d.getMinutes());}
  function draw(){
    var h='<header class="top"><h3>'+esc(TRIP.title)+'</h3>'+(TRIP.at?'<p>Updated '+when(TRIP.at)+'</p>':'')+'</header><div class="body">';
    TRIP.days.forEach(function(stops,i){
      h+='<section class="day"><button type="button" class="dayhead" data-day="'+i+'"><span class="daypill">Day '+(i+1)+I.chev+'</span>'+
        '<span class="daysum">'+stops.length+(stops.length===1?' place':' places')+'</span></button><ol class="stops">'+stops.map(stop).join('')+'</ol></section>';
    });
    h+='</div>';
    if(TRIP.memo.length)h+='<section class="memo'+(T.memo?' open':'')+'" aria-label="旅行備註"><button type="button" class="memo-handle" data-memo>'+I.up+'</button>'+
      '<div class="memo-body"><div class="memo-clip"><div class="memo-in"><div class="memo-ents">'+TRIP.memo.map(entry).join('')+'</div></div></div></div></section>';
    var nb,i;
    if(watch)watch.disconnect();
    sc.innerHTML=h;document.title=TRIP.title;
    days();memo();
    nb=sc.querySelectorAll('.nb');
    for(i=0;i<nb.length;i++){shape(nb[i]);if(watch)watch.observe(nb[i]);}
  }
  /* which days are open: shown by classes on the days that are there (a closed day is paler while another is open,
     as on the desktop) */
  function days(){
    var o=sc.querySelectorAll('.day'),any=false,i,shut;
    for(i=0;i<o.length;i++)if(!T.shut[i])any=true;
    for(i=0;i<o.length;i++){
      shut=!!T.shut[i];
      o[i].classList.toggle('shut',shut);o[i].classList.toggle('dim',shut&&any);
      o[i].querySelector('.dayhead').setAttribute('aria-expanded',String(!shut));
    }
  }
  function memo(){
    var m=sc.querySelector('.memo'),b;
    if(!m)return;
    b=m.querySelector('.memo-handle');
    m.classList.toggle('open',!!T.memo);
    b.setAttribute('aria-expanded',String(!!T.memo));b.setAttribute('aria-label',T.memo?'收起旅行備註':'展開旅行備註');
  }
  sc.addEventListener('click',function(e){
    if(!T)return;
    var c=e.target.closest('[data-ck]'),d=e.target.closest('[data-day]'),now;
    if(c){now=c.getAttribute('aria-checked')!=='true';T.done[c.dataset.ck]=now;keep();c.setAttribute('aria-checked',String(now));c.closest('.ck').classList.toggle('done',now);}
    else if(d){T.shut[d.dataset.day]=!T.shut[d.dataset.day];keep();days();}
    else if(e.target.closest('[data-memo]')){T.memo=!T.memo;keep();memo();}
  });

  /* ---------- start ---------- */
  function blank(lines){
    T=TRIP=null;if(watch)watch.disconnect();document.title='SomeDay';
    sc.innerHTML='<div class="blank"><h1>SomeDay</h1>'+lines.map(function(l){return '<p>'+l+'</p>';}).join('')+'</div>';
  }
  /* show a trip and remember it. Ticks made here are kept for the items the trip still has; the rest go. */
  function show(t,code){
    var old=store.trips[t.id],had={},done={},k;
    function note(en){if(en.k==='c')had[en.key]=1;}
    t.days.forEach(function(stops){stops.forEach(function(s){s.plan.forEach(note);});});t.memo.forEach(note);
    if(old&&old.done)for(k in old.done)if(had[k])done[k]=!!old.done[k];
    T=store.trips[t.id]={s:code,done:done,shut:old&&old.shut&&typeof old.shut==='object'?old.shut:{},memo:!!(old&&old.memo)};
    store.last=t.id;TRIP=t;keep();draw();
  }
  function start(){
    var code='';
    try{code=decodeURIComponent(location.hash.slice(1));}catch(e){code=location.hash.slice(1);}
    var kept=!code&&store.trips[store.last]&&store.trips[store.last].s;
    if(!code&&!kept){blank(['這裡會顯示從電腦傳來的行程。','在電腦上的 SomeDay 打開旅行選單，選 Send to phone，再用這支手機掃 QR code 或打開連結。']);return;}
    unpack(code||kept).then(function(t){show(t,code||kept);},function(err){
      blank(err&&err.message==='old'?['這支手機的系統版本太舊，讀不了這個連結。']:['這個連結讀不出來，可能在傳送的時候被截斷了。','請在電腦上的 SomeDay 重新 Send to phone 一次。']);
    });
  }
  window.addEventListener('hashchange',start);
  start();

  /* ---------- kept for when there is no network ----------
     sw.js keeps a copy of this page and of the fonts it used. The fonts of the very first visit were fetched before
     it was in place, so it is told which ones they were. */
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
    var tell=function(){
      Promise.all([navigator.serviceWorker.ready,document.fonts&&document.fonts.ready]).then(function(r){
        var urls=performance.getEntriesByType('resource').map(function(e){return e.name;}).filter(function(u){return /^https:\/\/fonts\.(googleapis|gstatic)\.com\//.test(u);});
        if(r[0].active&&urls.length)r[0].active.postMessage({keep:urls});
      }).catch(function(){});
    };
    if(document.readyState==='complete')tell();else window.addEventListener('load',tell);
  }
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
</body>
</html>
